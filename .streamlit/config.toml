# Light and dark themes. Viewers switch with the ⋮ menu -> Settings -> theme
# (the default follows their device). Charts read the current theme in plots.py.
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#5a9cf0"
backgroundColor = "#111418"
secondaryBackgroundColor = "#1c2027"
textColor = "#ecebe6"
